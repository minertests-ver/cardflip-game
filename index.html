const cur=()=>mode=='board'?board:mode=='game'?G:mode=='mp'?mp:mode=='wait'?wait:menu;

function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{ac();c.setPointerCapture(e.pointerId);const p=pos(e);P={x:p.x,y:p.y,d:1};if(!lock()&&mode=='game'&&G&&!G.pvp&&G.tt!=null&&G.started&&!G.over&&p.x<44&&p.y<44){pauseMenu();return}if(lock())return;cur().down&&cur().down(p.x,p.y)});

function tone(f,d,ty,v,sl,dl){const a=ac();if(!a||!SND)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

function shf(a,q){for(let i=a.length-1;i>0;i--){const j=Math.floor(q()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- 插丸子：依訂單顏色順序，點畫面讓竹籤射向丸子 ----
const danG=()=>{const CLR=['#ff9ec4','#fffaf0','#8ed081','#2b2b2b'],BY=250,NB=7,GAP=56;return{
init(){const pv=this.pvp,lb=LB(),sd=pv?this.mid*6529+83:(R()*1e9|0);this.nm='插丸子';this.sd=sd;this.rb=mb(sd);
 Object.assign(this,{need:3+(lb>=3?1:0),t:0,tl:30,sc:0,prog:0,oi:0,stun:0,cd:0,sh:[],m:0,ms:'',mc:'#1f9d3a',spd:85+Math.min(40,6*lb),bl:[]});
 for(let i=0;i<NB;i++)this.bl.push({x:i*GAP-20,ph:i*1.3,c:this.rc(),v:1});this.ord=this.mkOrd(0);
 this.itxt=`插丸子！上方訂單會告訴你要插哪幾種顏色（3~5 顆，要照順序）\n點畫面某處，竹籤會射向那裡，要預判丸子會移到哪\n插錯顏色或插到焦黑的丸子，最後插的那顆會掉下去，竹籤還會暈一下\n`+(pv?'兩人的丸子一模一樣，30 秒內完成越多串越好':`30 秒內完成 ${this.need} 串就過關`)},
rc(){const r=this.rb();return r<.14?3:Math.min(2,Math.floor((r-.14)/.86*3))},
mkOrd(i){const q=mb(this.sd+7777+i*131),k=3+(q()*3|0);return Array.from({length:k},()=>q()*3|0)},
say(s,c){this.ms=s;this.mc=c;this.m=.9},
down(px){if(this.stun>0||this.cd>0||this.tl<=0||this.over)return;this.cd=.28;this.sh.push({x:Math.max(20,Math.min(340,px)),t:0,d:0});snd('whoosh')},
pen(n,s){this.prog=Math.max(0,this.prog-n);this.stun=n>1?1:.8;this.say(s,'#d62828');snd('bad')},
resolve(sx){let b=null,bd=26;this.bl.forEach(o=>{if(!o.v)return;const d=Math.abs(o.x-sx);if(d<bd){bd=d;b=o}});
 if(!b){this.say('落空了','#9aa');snd('miss');return}
 b.v=0;if(b.c==3){this.pen(2,'😖 焦掉了！');return}
 if(b.c!=this.ord[this.prog]){this.pen(1,'顏色錯了！');return}
 this.prog++;snd('catch');
 if(this.prog>=this.ord.length){this.sc++;this.prog=0;this.oi++;this.ord=this.mkOrd(this.oi);this.say('完成一串！','#1f9d3a');snd('ding');if(!this.pvp&&this.sc>=this.need){this.over||finish(1,`完成 ${this.sc} 串！`)}}},
update(dt){this.t+=dt;this.cd-=dt;this.stun-=dt;this.m-=dt;this.tl=Math.max(0,this.tl-dt);
 this.bl.forEach(b=>{b.x+=this.spd*dt;if(b.x>380){b.x-=NB*GAP;b.c=this.rc();b.v=1}});
 for(const s of this.sh){s.t+=dt;if(!s.d&&s.t>=.22){s.d=1;this.resolve(s.x)}}this.sh=this.sh.filter(s=>s.t<.4);
 if(this.tl<=0&&!this.over)this.pvp?finish(0,`完成 ${this.sc} 串`,null,this.sc*10+this.prog,0):finish(0,`時間到！完成 ${this.sc} 串（要 ${this.need} 串）`)},
pv(){return this.sc*10+this.prog},
draw(){bg('#3a1f3d','#8a4a52');T(`🍡 ${this.sc}${this.pvp?'':' / '+this.need} 串　⏱ ${Math.ceil(this.tl)} 秒`,180,26,21,'#fff');if(this.pvp)T(`對手 ${Math.floor((this.on||0)/10)} 串`,180,50,14,'#ffd6a5');
 RC(20,64,320,64,14,'rgba(255,255,255,.14)');T('訂單',50,96,15,'#ffd6a5');
 this.ord.forEach((c,i)=>{const cx=104+i*42;C2(cx,96,15,CLR[c]);if(i<this.prog){x.strokeStyle='#ffe066';x.lineWidth=3;x.beginPath();x.arc(cx,96,18,0,7);x.stroke();T('✓',cx,96,16,'#2a7a2a')}else if(i==this.prog){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(cx,96,19,0,7);x.stroke()}});
 for(const b of this.bl){if(!b.v)continue;const y=BY+10*Math.sin(this.t*2+b.ph);C2(b.x,y,21,CLR[b.c]);C2(b.x-6,y-7,5,'rgba(255,255,255,.45)');if(b.c==3)T('🔥',b.x,y-24,14)}
 x.lineCap='round';for(const s of this.sh){const p=Math.min(1,s.t/.22),ex=180+(s.x-180)*p,ey=540+(BY+16-540)*p;x.strokeStyle='#d9b77a';x.lineWidth=5;x.beginPath();x.moveTo(180,540);x.lineTo(ex,ey);x.stroke();C2(ex,ey,4,'#fff')}
 RC(150,530,60,30,10,this.stun>0?'#777':'#8a5a30');
 RC(20,452,320,50,14,'rgba(255,255,255,.14)');x.strokeStyle='#d9b77a';x.lineWidth=4;x.beginPath();x.moveTo(34,477);x.lineTo(326,477);x.stroke();this.ord.slice(0,this.prog).forEach((c,i)=>C2(64+i*38,477,15,CLR[c]));
 if(this.m>0)T(this.ms,180,180,26,this.mc);if(this.stun>0)T('💫',180,500,22);T('點畫面某處，竹籤射向那裡',180,425,13,'#ffd6a5')}}};

// ---- 麻將連連看：兩張相同的牌，用不超過 2 個轉彎的線連起來 ----
const mjG=()=>{const RW=7,CW=6,TW=50,TH=56,GP=4,X0=20,Y0=88,NT=14,PD=[[[-1,-1],[0,0],[1,1]],[[-1,-1.2],[0,-1.2],[1,-1.2],[-1,0],[1,0],[-1,1.2],[1,1.2]]];
const cx=c=>X0+(c-1)*(TW+GP)+TW/2,cy=r=>Y0+(r-1)*(TH+GP)+TH/2;
return{
init(){const pv=this.pvp,sd=pv?this.mid*3331+97:(R()*1e9|0),lb=LB();this.nm='麻將連連看';this.sd=sd;this.sf=0;
 Object.assign(this,{t:0,tl:30,sc:0,sel:null,path:null,pt:0,m:0,ms:'',need:10+Math.min(4,lb>>1)});
 const q=mb(sd),tot=RW*CW/2;this.tiles=[];for(let i=0;i<tot;i++){const t=q()*NT|0;this.tiles.push(t,t)}
 this.g=[];this.deal(q);
 this.itxt=`麻將連連看！點兩張一樣的牌，中間能用不超過 2 個轉彎的線連起來，就會消除\n線可以繞到牌的外圍\n沒有可消的牌時會自動洗牌\n`+(pv?'兩人的牌面一樣，30 秒內消除越多對越好，全部消完則比誰快':`30 秒內消除 ${this.need} 對就過關`)},
deal(q){let tr=0;do{const a=shf(this.tiles.slice(),q);this.g=Array.from({length:RW+2},()=>Array(CW+2).fill(-1));let k=0;for(let r=1;r<=RW;r++)for(let c=1;c<=CW;c++)this.g[r][c]=a[k++]}while(!this.hasMove()&&tr++<40)},
reshuf(){const q=mb(this.sd+9000+this.sf*37),cells=[],ty=[];for(let r=1;r<=RW;r++)for(let c=1;c<=CW;c++)if(this.g[r][c]>=0){cells.push([r,c]);ty.push(this.g[r][c])}
 let tr=0;do{shf(ty,q);cells.forEach((p,i)=>this.g[p[0]][p[1]]=ty[i])}while(!this.hasMove()&&tr++<40)},
emp(r,c){return r>=0&&c>=0&&r<=RW+1&&c<=CW+1&&this.g[r][c]<0},
seg(r1,c1,r2,c2){if(r1==r2){const a=Math.min(c1,c2),b=Math.max(c1,c2);for(let c=a+1;c<b;c++)if(this.g[r1][c]>=0)return false;return true}
 if(c1==c2){const a=Math.min(r1,r2),b=Math.max(r1,r2);for(let r=a+1;r<b;r++)if(this.g[r][c1]>=0)return false;return true}return false},
l1(a,b){if((a[0]==b[0]||a[1]==b[1])&&this.seg(a[0],a[1],b[0],b[1]))return[a,b];
 for(const k of[[a[0],b[1]],[b[0],a[1]]]){if((k[0]==a[0]&&k[1]==a[1])||(k[0]==b[0]&&k[1]==b[1]))continue;if(this.g[k[0]][k[1]]<0&&this.seg(a[0],a[1],k[0],k[1])&&this.seg(k[0],k[1],b[0],b[1]))return[a,k,b]}return null},
